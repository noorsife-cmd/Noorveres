<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#171522">
  <meta name="description" content="Hello, world!">
  <title>Hello, World!</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #171522;
      color: #f5eddf;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at 20% 20%, rgba(199,169,237,.2), transparent 32rem),
        radial-gradient(circle at 80% 80%, rgba(242,189,166,.13), transparent 28rem),
        #171522;
    }
    main { text-align: center; }
    p {
      margin: 0 0 16px;
      color: #f2bda6;
      font-size: .8rem;
      font-weight: 600;
      letter-spacing: .28em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(3.5rem, 12vw, 7rem);
      font-weight: 400;
      letter-spacing: -.06em;
    }
    h1 span { color: #c7a9ed; font-style: italic; }
  </style>
</head>
<body>
  <main>
    <p>A little beginning</p>
    <h1>Hello, <span>World!</span></h1>
  </main>
</body>
</html>
